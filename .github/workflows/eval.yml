# eval.yml - quality gates on every pull request (and push to main).
# Runs the retrieval evaluation and a 30-job smoke eval with the fake model, and FAILS if
# retrieval recall, bid/skip F1 or scam recall drop below evals/thresholds.yaml, or if any
# unsupported claim survives verification.
name: Eval
on: [push, pull_request]

jobs:
  smoke-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: data/processed/models
          key: rag-models-bge-small-minilm-l6
      - run: python -m pip install -e ".[dev]"
      - name: Retrieval eval (no LLM)
        run: |
          python -m evals.runners.rag_eval
          python -c "import json,yaml; r=json.load(open('evals/results/rag_eval.json')); t=yaml.safe_load(open('evals/thresholds.yaml')); v=r['variants'][r['shipped']]['overall']['recall@5']; print('shipped recall@5', v); assert v >= t['min_retrieval_recall_at5'], 'retrieval recall dropped'"
      - name: Decision smoke eval (30 jobs, fake model)
        run: python -m evals.runners.decision_eval --fake --smoke
