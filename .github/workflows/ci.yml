# CI: runs on every push and pull request.
#   checks : lint + unit, integration and contract (MCP tool-schema snapshot) tests
#   e2e    : builds the web app and runs the 5 Playwright browser tests
name: CI
on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Keep the downloaded open models (embeddings + reranker, ~210 MB) between runs.
      - uses: actions/cache@v4
        with:
          path: data/processed/models
          key: rag-models-bge-small-minilm-l6
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: data/processed/models
          key: rag-models-bge-small-minilm-l6
      - run: python -m pip install -e ".[dev]"
      - run: npm ci
        working-directory: apps/web
      # GitHub's Ubuntu runners already have the system libraries Chrome needs, so we only download
      # the browser itself (the apt mirror behind --with-deps kept timing out).
      - run: npx playwright install chromium
        working-directory: apps/web
      - run: npx playwright test
        working-directory: apps/web
        env:
          PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report
