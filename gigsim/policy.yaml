# The marketplace's platform policy, served at GET /policy.
# The assignment's "change request" (a new rule or cost) is applied by editing
# THIS file only, so we can show how cheaply the system absorbs it.
version: "v2-2026-11-02"         # platform policy update (the change request)
weekly_connects: 100            # Connects each freelancer gets per week
max_cover_letter_chars: 5000
extra_connects_per_proposal: 2  # NEW: every proposal costs 2 extra Connects
required_statements:            # NEW: sentences every proposal must contain (enforced by the Compliance Guard)
  - "This proposal was drafted with AI assistance and reviewed by me."
rules:
  - No off-platform contact or payment (no emails, phone numbers, WhatsApp, Telegram).
  - No unpaid production work disguised as a test.
  - Never fabricate skills, clients, outcomes, credentials or years of experience.
  - Do not guarantee results.
  - Automation is allowed only with a human approving every proposal and message.
  - Proposals prepared with automation must disclose AI assistance (added 2 Nov 2026).
  - Each proposal costs 2 extra Connects (added 2 Nov 2026).
