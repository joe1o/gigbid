# agent/config.yaml - the ONE place for settings: which marketplace, which models,
# budgets and thresholds. Code reads this file; nothing is hard-coded.
# Any value marked "env:" can be overridden by that environment variable.

marketplace:
  mode: gigsim                      # env: MARKETPLACE_MODE   gigsim | upwork_live
  gigsim_base_url: http://localhost:8081   # env: GIGSIM_BASE_URL
  # Dev logins for the three simulated GigSim accounts (fake simulator tokens).
  # In the web app a user connects their own account; these are the fallback.
  dev_accounts:
    ml_engineer: gigsim-ml-token
    web_developer: gigsim-web-token
    data_analyst: gigsim-data-token
  max_requests_per_minute: 40       # stay under GigSim's 60/min limit
  timeout_seconds: 10
  max_retries: 3                    # bounded retries with backoff
  upwork_mcp_url: https://mcp.upwork.com/mcp

# Where each MCP server listens (agents connect over Streamable HTTP).
mcp_servers:
  portfolio:   {url: http://localhost:8091/mcp}   # env: PORTFOLIO_MCP_URL
  marketplace: {url: http://localhost:8092/mcp}   # env: MARKETPLACE_MCP_URL
  workspace:   {url: http://localhost:8093/mcp}   # env: WORKSPACE_MCP_URL

workspace:
  timezone_offset_hours: 5          # Pakistan time (UTC+5)
  work_hours: [9, 17]

rag:
  # Chosen by measurement (evals/results/rag_eval.json, docs/adr/001-rag-design.md):
  variant: v0_naive                 # evidence retrieval for the Writer: best Recall@5 (0.947), fastest
  fit_variant: v8_corrective        # requirement -> evidence matrix: refuses 100% of poor-fit reqs, 2% of good
  embedding_model: nomic-ai/nomic-embed-text-v1.5-Q   # open, 130 MB, CPU
  reranker_model: Xenova/ms-marco-MiniLM-L-6-v2       # open cross-encoder, 80 MB, CPU
  chunk_words: 40                   # fixed chunk size (words) ...
  chunk_overlap: 10                 # ... with this much overlap
  candidates: 20                    # how many chunks the reranker re-scores
  # V8: reranker score below this = "weak evidence". Picked from the dev-set score
  # distribution: poor-fit requirements score <= -8.3 (90th pct), good-fit median +0.9.
  corrective_threshold: -7.0
  verify_threshold: -2.0            # claim verification: min reranker score to count as support

models:
  profile: open
  nodes:
    scout: qwen3-4b
    analyst: qwen3-4b
    risk_assessor: qwen3-4b
    fit_matcher: qwen3-4b
    pricing: qwen3-4b
    writer: configure-your-model
    critic: configure-your-model
    client_liaison: configure-your-model
  embeddings: nomic-embed-text
  reranker: bge-reranker-v2-m3

budgets:
  max_graph_steps: 30
  max_revisions: 2
  max_tokens_per_job: 12000

thresholds:
  minimum_fit_score: 0.60
  maximum_risk_score: 0.70
