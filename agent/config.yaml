# agent/config.yaml - the ONE place for settings: which marketplace, which models,
# budgets and thresholds. Code reads this file; nothing is hard-coded.
# Any value marked "env:" can be overridden by that environment variable.

marketplace:
  mode: gigsim                      # env: MARKETPLACE_MODE   gigsim | upwork_live
  gigsim_base_url: http://localhost:8081   # env: GIGSIM_BASE_URL
  # Dev logins for the three simulated GigSim accounts (fake simulator tokens).
  # In the web app a user connects their own account; these are the fallback.
  dev_accounts:
    ml_engineer: gigsim-ml-token
    web_developer: gigsim-web-token
    data_analyst: gigsim-data-token
  max_requests_per_minute: 40       # stay under GigSim's 60/min limit
  timeout_seconds: 10
  max_retries: 3                    # bounded retries with backoff
  upwork_mcp_url: https://mcp.upwork.com/mcp

# Where each MCP server listens (agents connect over Streamable HTTP).
mcp_servers:
  portfolio:   {url: http://localhost:8091/mcp}   # env: PORTFOLIO_MCP_URL
  marketplace: {url: http://localhost:8092/mcp}   # env: MARKETPLACE_MCP_URL
  workspace:   {url: http://localhost:8093/mcp}   # env: WORKSPACE_MCP_URL

workspace:
  timezone_offset_hours: 5          # Pakistan time (UTC+5)
  work_hours: [9, 17]

rag:
  # Chosen by measurement (evals/results/rag_eval.json, docs/adr/001-rag-design.md):
  variant: v0_naive                 # evidence retrieval for the Writer: best Recall@5 (0.898 bge-small, 0.947 nomic), fastest
  fit_variant: v8_corrective        # requirement -> evidence matrix: refuses 100% of poor-fit reqs, 2% of good
  # Embeddings: bge-small replaced nomic-embed-text because nomic needs ~290 MB of RAM in use and the
  # free 512 MB host cannot fit it; both were measured (rag_eval.json vs rag_eval_nomic.json).
  embedding_model: BAAI/bge-small-en-v1.5           # open, 67 MB file, ~170 MB in memory, CPU
  reranker_model: Xenova/ms-marco-MiniLM-L-6-v2       # open cross-encoder, 80 MB, CPU
  chunk_words: 40                   # fixed chunk size (words) ...
  chunk_overlap: 10                 # ... with this much overlap
  candidates: 20                    # how many chunks the reranker re-scores
  # V8: reranker score below this = "weak evidence". Picked from the dev-set score
  # distribution: poor-fit requirements score <= -8.3 (90th pct), good-fit median +0.9.
  corrective_threshold: -7.0
  verify_threshold: -2.0            # claim verification: min reranker score to count as support

# LLMs. Every node's model is set HERE, never in code ("route by node").
# Only nodes that need language understanding call an LLM; Scout, Fit Matcher,
# Pricing and Compliance are rules + tools (cheaper, deterministic).
models:
  profile: open                     # env: MODEL_PROFILE   open (required) | paid (optional)
  profiles:
    open:                           # open-weight models on Groq (hosted open-model provider)
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      nodes:
        job_analyst: openai/gpt-oss-20b        # cheap + frequent -> small model
        risk_assessor: openai/gpt-oss-20b
        liaison_intent: openai/gpt-oss-20b
        writer: openai/gpt-oss-120b            # quality matters -> strongest affordable model
        critic: openai/gpt-oss-120b
        liaison_reply: openai/gpt-oss-120b
      fallback: openai/gpt-oss-120b            # used if a cheap node's model fails
      fallback_2: openai/gpt-oss-20b           # last resort, e.g. when the 120b daily token cap is reached
      extra: {reasoning_effort: low}           # gpt-oss: think briefly (fewer tokens, faster)
    open_small:                     # 2nd open configuration for the comparison: 20b everywhere
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY
      nodes: {job_analyst: openai/gpt-oss-20b, risk_assessor: openai/gpt-oss-20b, liaison_intent: openai/gpt-oss-20b,
              writer: openai/gpt-oss-20b, critic: openai/gpt-oss-20b, liaison_reply: openai/gpt-oss-20b}
      fallback: openai/gpt-oss-120b
      extra: {reasoning_effort: low}
    paid:                           # optional: Gemini through its OpenAI-compatible endpoint
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      api_key_env: GEMINI_API_KEY
      nodes: {job_analyst: gemini-flash-latest, risk_assessor: gemini-flash-latest, liaison_intent: gemini-flash-latest,
              writer: gemini-flash-latest, critic: gemini-flash-latest, liaison_reply: gemini-flash-latest}
      fallback: gemini-flash-latest
      extra: {}
  # USD per million tokens [input, output], for cost reporting (Groq list prices; check console.groq.com).
  prices:
    openai/gpt-oss-20b: [0.075, 0.30]
    openai/gpt-oss-120b: [0.15, 0.60]
    gemini-flash-latest: [0.30, 2.50]
  timeout_seconds: 60
  max_retries: 8                    # wait and retry on provider rate limits (HTTP 429) instead of failing

budgets:
  max_graph_steps: 30               # more node runs than this -> "needs attention"
  max_revisions: 2                  # Critic may send a draft back at most twice
  max_tokens_per_job: 40000         # more tokens than this -> "needs attention"

# Scheduled scouting (runs in the API process as a background task, never inside a web request).
scheduling:
  scout_interval_minutes:
    gigsim: 120          # simulator: every 2 hours
    upwork_live: 360     # live: every 6 hours - a person checking a few times a day, never scraping-like polling

safety:
  injection_defence: true           # false only for the "attack success before defences" experiment

thresholds:
  minimum_fit_score: 0.60           # below -> skip
  watch_fit_score: 0.40             # between watch and minimum -> watch
  proposal_words: [80, 300]         # Critic's length range
  maximum_risk_score: 0.70
